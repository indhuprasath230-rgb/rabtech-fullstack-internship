<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="Dynamic product dashboard using JavaScript and REST API.">

    <title>Dynamic Product Dashboard</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <!-- HEADER -->

    <header class="header">

        <div class="header-container">

            <h1>Product Dashboard</h1>

            <nav aria-label="Main navigation">

                <a href="#products">
                    Products
                </a>

                <a href="#cart">
                    Cart
                    <span id="cart-count">0</span>
                </a>

            </nav>

        </div>

    </header>


    <!-- MAIN -->

    <main class="container">

        <!-- PAGE TITLE -->

        <section class="hero">

            <h2>Explore Products</h2>

            <p>
                Products are loaded from a public REST API.
            </p>

        </section>


        <!-- SEARCH AND FILTER -->

        <section class="controls" aria-label="Product controls">

            <label for="search">
                Search Products
            </label>

            <input type="search" id="search" placeholder="Search products..." aria-label="Search products">


            <label for="category">
                Category
            </label>

            <select id="category">

                <option value="all">
                    All Categories
                </option>

            </select>


            <label for="sort">
                Sort
            </label>

            <select id="sort">

                <option value="default">
                    Default
                </option>

                <option value="low">
                    Price: Low to High
                </option>

                <option value="high">
                    Price: High to Low
                </option>

                <option value="name">
                    Name: A to Z
                </option>

            </select>

        </section>


        <!-- ERROR BANNER -->

        <div id="error-banner" class="error-banner" role="alert" hidden>

            Unable to load products.
            Please try again.

            <button id="retry-button">
                Retry
            </button>

        </div>


        <!-- LOADING -->

        <section id="loading" class="loading" aria-live="polite">

            <div class="skeleton"></div>
            <div class="skeleton"></div>
            <div class="skeleton"></div>
            <div class="skeleton"></div>

        </section>


        <!-- PRODUCTS -->

        <section id="products">

            <h2>Products</h2>

            <p id="result-count" class="result-count">
                Loading products...
            </p>

            <div id="product-list" class="product-grid">
            </div>

        </section>


        <!-- CART -->

        <section id="cart" class="cart-section">

            <h2>Shopping Cart</h2>

            <div id="cart-items">

                <p>
                    Your cart is empty.
                </p>

            </div>

            <p class="cart-total">

                Total:
                ₹<span id="cart-total">0.00</span>

            </p>

            <button id="clear-cart" class="clear-button">

                Clear Cart

            </button>

        </section>

    </main>


    <!-- FOOTER -->

    <footer>

        <p>
            © 2026 Dynamic Product Dashboard
        </p>

    </footer>


    <!-- JAVASCRIPT -->

    <script type="module" src="app.js">
    </script>

</body>

</html>
