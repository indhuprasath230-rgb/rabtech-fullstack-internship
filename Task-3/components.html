<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Accessible HTML5 dashboard components.">
    <title>Dashboard Components</title>
</head>

<body>

    <header>
        <h1>Dashboard Components</h1>

        <nav aria-label="Main navigation">
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="dashboard.html">Dashboard</a></li>
                <li><a href="components.html">Components</a></li>
            </ul>
        </nav>
    </header>

    <main>

        <section aria-labelledby="form-section">
            <h2 id="form-section">Contact Form</h2>

            <form>

                <fieldset>
                    <legend>Contact Information</legend>

                    <p>
                        <label for="fullname">Full Name</label>
                        <input type="text" id="fullname" name="fullname" required minlength="3">
                    </p>

                    <p>
                        <label for="contact-email">Email</label>
                        <input type="email" id="contact-email" name="email" required>
                    </p>

                    <p>
                        <label for="message">Message</label>
                        <textarea id="message" name="message" rows="5" required
                            aria-label="Enter your message"></textarea>
                    </p>

                    <button type="submit">
                        Submit
                    </button>

                </fieldset>

            </form>

        </section>

        <section aria-labelledby="dialog-section">

            <h2 id="dialog-section">Modal Dialog</h2>

            <button type="button" aria-controls="user-dialog">
                Open User Dialog
            </button>

            <dialog id="user-dialog">

                <form method="dialog">

                    <h3>Confirm Action</h3>

                    <p>
                        Are you sure you want to continue?
                    </p>

                    <button value="cancel">
                        Cancel
                    </button>

                    <button value="confirm">
                        Confirm
                    </button>

                </form>

            </dialog>

        </section>

    </main>

    <footer>
        <p>&copy; 2026 Enterprise Dashboard</p>
    </footer>

</body>

</html>
